<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<style>
  :root {
    --bg: #000000;
    --card-bg: #3C3C3E;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.5);
    --divider: #262626;
    --circle-bg: #2a2b31;
    --circle-border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: "OpenAI Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .phone-frame {
    width: 390px;
    max-width: 100%;
    height: 844px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 0;
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 600;
    position: relative;
    z-index: 3;
  }
  .status-right { display: flex; align-items: center; gap: 6px; }

  .scroll-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    padding-top: 44px;
  }

  .back-circle-fixed {
    position: absolute;
    top: 44px;
    left: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--circle-bg);
    border: 1px solid var(--circle-border);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6;
  }
  .back-circle-fixed svg { width: 20px; height: 20px; }

  .header {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    padding: 10px 20px 18px;
  }
  .header-title {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 0 16px 8px;
  }
  .group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0 16px 28px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    min-height: 52px;
    position: relative;
    background: var(--card-bg);
    border-radius: 4px;
  }
  .row.two-line { min-height: 64px; }
  .group .row:first-child { border-top-left-radius: 24px; border-top-right-radius: 24px; }
  .group .row:last-child { border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
  .row-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .row-icon svg { width: 22px; height: 22px; }
  .row-text { flex: 1; min-width: 0; }
  .row-title { font-size: 16px; font-weight: 500; color: var(--text-primary); }
  .row-value { font-size: 14px; color: var(--text-secondary); }
  .row-trailing { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .row-trailing-value { font-size: 15px; color: var(--text-secondary); }
  .chevron { width: 18px; height: 18px; transform: rotate(180deg); opacity: 0.5; }
  .chevron svg { width: 18px; height: 18px; }

  .top-fade {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 36px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="phone-frame">

  <div class="status-bar">
    <span>2:44</span>
    <div class="status-right">
      <span style="font-size:11px; font-weight:500;">4G+</span>
      <span style="font-size:11px; font-weight:600; background:#fff; color:#000; border-radius:3px; padding:1px 4px;">28</span>
    </div>
  </div>

  <div class="back-circle-fixed" aria-label="Back">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
  </div>

  <div class="scroll-area">

    <div class="header">
      <div></div>
      <div class="header-title">Settings</div>
      <div></div>
    </div>

    <p class="section-label">Tools &amp; agents</p>
    <div class="group">
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12v4"/><path d="M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><path d="M17 6a2 2 0 011.414.586l3 3A2 2 0 0122 11v8a2 2 0 01-2 2H4a2 2 0 01-2-2v-8a2 2 0 01.586-1.414l3-3A2 2 0 017 6z"/><path d="M2 14h20"/><path d="M8 12v4"/></svg></div>
        <div class="row-text"><div class="row-title">Built-in tools</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">12 active</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
        <div class="row-text"><div class="row-title">Coding</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">Enabled</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div>
        <div class="row-text"><div class="row-title">Agents</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">0 custom</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg></div>
        <div class="row-text"><div class="row-title">Jobs</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">0 active</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg></div>
        <div class="row-text"><div class="row-title">Background agent</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">Ready</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
    </div>

    <p class="section-label">Workspace</p>
    <div class="group">
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></svg></div>
        <div class="row-text"><div class="row-title">Saved prompts</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">0</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01"/><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M21.946 12.013H2.054"/><path d="M6 16h.01"/></svg></div>
        <div class="row-text"><div class="row-title">Memory</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">Local</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg></div>
        <div class="row-text"><div class="row-title">Database</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">Local</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
    </div>

    <p class="section-label">Preferences</p>
    <div class="group">
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></div>
        <div class="row-text"><div class="row-title">Notifications</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">On</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3A9 9 0 0 1 12 21Z" fill="#ffffff" stroke="none"/></svg></div>
        <div class="row-text"><div class="row-title">Theme</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">System</span>
          <div class="chevron"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></div>
        </div>
      </div>
    </div>

    <p class="section-label">App</p>
    <div class="group">
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg></div>
        <div class="row-text"><div class="row-title">App update</div></div>
        <div class="row-trailing">
          <span class="row-trailing-value">Up to date</span>
        </div>
      </div>
      <div class="row">
        <div class="row-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></div>
        <div class="row-text"><div class="row-title">Refresh config</div></div>
      </div>
    </div>

    <div style="height: 24px;"></div>

  </div>

  <div class="top-fade"></div>

</div>

</body>
</html>
